name: Build Custom OpenWrt for H1Radio TI04-708HP

on:
  push:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Extra packages to install (e.g., luci luci-app-wireguard)'
        required: false
        default: 'luci'

jobs:
  build:
    name: Build OpenWrt
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Linux Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Replace Ubuntu mirrors with kernel.org for reliability
          sudo find /etc/apt/ -type f -exec sed -i 's/azure.archive.ubuntu.com/mirrors.kernel.org/g' {} + 2>/dev/null || true
          sudo find /etc/apt/ -type f -exec sed -i 's/archive.ubuntu.com/mirrors.kernel.org/g' {} + 2>/dev/null || true
          sudo find /etc/apt/ -type f -exec sed -i 's/security.ubuntu.com/mirrors.kernel.org/g' {} + 2>/dev/null || true
          sudo apt-get clean
          sudo apt-get update -o Acquire::ForceIPv4=true -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::ForceIPv4=true -o Acquire::Retries=3 build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils python3-setuptools rsync unzip zlib1g-dev file wget device-tree-compiler python3-pip python3-m2crypto swig libelf-dev

      - name: Clone OpenWrt Source
        run: |
          git clone --depth 1 --branch v24.10.8 https://git.openwrt.org/openwrt/openwrt.git openwrt

      - name: Setup Device Tree
        run: bash scripts/01-setup-dts.sh

      - name: Patch Makefiles
        run: bash scripts/02-patch-makefiles.sh

      - name: Patch Platform for Sysupgrade
        run: bash scripts/03-patch-platform.sh

      - name: Inject Cloud App and Custom Scripts
        run: bash scripts/04-inject-cloud-app.sh

      - name: Configure and Prepare
        run: bash scripts/05-configure.sh

      - name: Download Dependencies
        run: |
          cd openwrt
          make download -j8

      - name: Compile Firmware
        run: bash scripts/06-compile.sh

      - name: Upload Firmware (only when every build check passed)
        uses: actions/upload-artifact@v4
        with:
          name: H1Radio_TI04-708HP_SuperFirmware
          path: |
            openwrt/bin/targets/ipq40xx/generic/*
            openwrt/build.log

      # A failed build still leaves images on disk: 06-compile.sh runs `make`
      # first and only then verifies the driver channel table and the ath10k
      # firmware blobs. When one of those checks fails the .bin files exist
      # but are known-bad, so they must NOT be offered for download - that is
      # how a rejected image ends up flashed. Ship the log alone.
      - name: Upload build log only (build or verification failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FAILED-BUILD-LOG-DO-NOT-FLASH
          path: |
            openwrt/build.log
            openwrt/logs/
          if-no-files-found: warn
